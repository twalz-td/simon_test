.cpill:hover{border-color:var(--faint);color:var(--ink)}
.cpill.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.cpill .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.sdiv{border-top:1px solid var(--bsoft);padding-top:14px;margin-top:6px}
.fadein{animation:fi .25s ease}
@keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.gauge-wrap{position:relative;height:9px;border-radius:999px;background:linear-gradient(90deg,#0B7B87 0%,#B07E28 54%,#C64B4B 100%);border:1px solid var(--bsoft);margin:8px 0}
.gauge-needle{position:absolute;top:50%;transform:translate(-50%,-50%);width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.2);transition:left .4s ease}
.swot-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.swot-box{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px}
.swot-box ul{list-style:none;padding:0;margin-top:8px}
.swot-box li{font-size:12.5px;color:var(--ink);padding:4px 0 4px 14px;position:relative;line-height:1.5;border-bottom:1px solid var(--bsoft)}
.swot-box li:last-child{border-bottom:none}
.swot-box li::before{content:'•';position:absolute;left:0;color:var(--faint)}
.map-tok{position:absolute;transform:translate(-50%,-50%);z-index:10;transition:left .5s ease-in-out,top .5s ease-in-out;overflow:visible}
.tok-ring{position:absolute;inset:-14px;border-radius:50%;border:1.5px solid currentColor;opacity:.38;pointer-events:none}
.tok-dot{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Space Mono',monospace;font-size:9px;font-weight:700;color:#fff;letter-spacing:.02em;user-select:none;position:relative;z-index:1}
.brand-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px}
.brand-bar-wrap{height:8px;border-radius:999px;background:#F0F5F6;border:1px solid var(--bsoft);margin:8px 0;overflow:hidden}
.brand-bar-fill{height:100%;border-radius:999px;transition:width .4s ease}
#logo-mark{display:flex;flex-direction:column;align-items:center;line-height:1;flex-shrink:0}
#logo-mark .top{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.35em;color:var(--co);font-weight:700}
#logo-mark .mid{font-family:'Pacifico',cursive;font-size:30px;color:var(--ink);margin:1px 0}
#logo-mark .bot{font-family:'Space Mono',monospace;font-size:8px;letter-spacing:.22em;color:var(--mist);font-weight:700}
.note{font-size:11px;color:var(--faint)}

  try{return SWOTS[S.origin][S.season][S.comp];}catch(e){return null;}
}

// ── TAB ROUTING ────────────────────────────────────────────────────────────
function setTab(t){
  S.tab=t;
  document.querySelectorAll('.ntab').forEach((b,i)=>{
    b.classList.toggle('on',['swot','brand','sandbox'][i]===t);
  });
  if(t==='swot'){
    g('sub').textContent='Head-to-head competitive analysis. Select an origin market, season, and competitor to compare.';
    renderSwotSidebar();renderSwotCanvas();
  }else if(t==='brand'){
    g('sub').textContent='Brand platform vs. traveler reality. How well does each destination\'s marketing hold up to the actual experience?';
    renderBrandSidebar();renderBrandCanvas();
  }else{
    g('sub').textContent='Plot any two competitive dimensions on a live perceptual map. Swap axes to explore.';
    renderSandboxSidebar();buildSandboxMap();
  }
}

// ── SWOT SIDEBAR ───────────────────────────────────────────────────────────
function renderSwotSidebar(){
  const cs=currentCompSet();
  let html=`<div class="lbl sec-head"><span style="color:var(--co)">01 </span>Origin Market</div>`;
  Object.keys(ORIGIN_LABELS).forEach(o=>{
    html+=`<button class="cpill${S.origin===o?' on':''}" onclick="setOrigin('${o}')">${ORIGIN_LABELS[o]}</button>`;
  });
  html+=`<div class="lbl sec-head sdiv"><span style="color:var(--co)">02 </span>Season</div>`;
  Object.keys(COMPSETS[S.origin]).forEach(s=>{
    html+=`<button class="cpill${S.season===s?' on':''}" onclick="setSeason('${s}')">${SEASON_LABELS[s]}</button>`;
  });
  html+=`<div class="lbl sec-head sdiv"><span style="color:var(--co)">03 </span>Competitor</div>`;
  Object.entries(cs.groups).forEach(([grp,comps])=>{
    html+=`<div class="lbl" style="margin-bottom:4px;margin-top:8px">${grp}</div>`;
    comps.forEach(c=>{
      html+=`<button class="cpill${S.comp===c?' on':''}" onclick="setComp('${c}')">
        <span class="dot" style="background:${BRIGHT[c]}"></span>${DN[c]}
      </button>`;
    });
  });
  g('sidebar').innerHTML=html;
}

function setOrigin(o){
  S.origin=o;
  const seasons=Object.keys(COMPSETS[o]);
  if(!seasons.includes(S.season))S.season=seasons[0];
  const cs=COMPSETS[o][S.season];
  if(!cs.comps.includes(S.comp))S.comp=cs.comps[0];
  renderSwotSidebar();renderSwotCanvas();
}
function setSeason(s){
  S.season=s;
  const cs=COMPSETS[S.origin][s];
  if(!cs.comps.includes(S.comp))S.comp=cs.comps[0];
  renderSwotSidebar();renderSwotCanvas();
}
function setComp(c){S.comp=c;renderSwotSidebar();renderSwotCanvas();}

// ── SANDBOX SIDEBAR ────────────────────────────────────────────────────────
function renderSandboxSidebar(){
  let html=`<div class="lbl sec-head"><span style="color:var(--co)">01 </span>Horizontal (X) Axis</div>`;
  AK.forEach(k=>{
    html+=`<button class="cpill${S.xAxis===k?' on':''}" ${S.yAxis===k?'disabled':''} onclick="setXAxis('${k}')">${k}</button>`;
  });
  html+=`<div class="lbl sec-head sdiv"><span style="color:var(--co)">02 </span>Vertical (Y) Axis</div>`;

    html+=`<button class="cpill${S.yAxis===k?' on':''}" ${S.xAxis===k?'disabled':''} onclick="setYAxis('${k}')">${k}</button>`;

function setXAxis(v){S.xAxis=v;if(S.yAxis===v){S.yAxis=AK.find(a=>a!==v);}renderSandboxSidebar();updateSandboxMap();}
function setYAxis(v){S.yAxis=v;renderSandboxSidebar();updateSandboxMap();}

// ── SANDBOX MAP ────────────────────────────────────────────────────────────
function buildSandboxMap(){
  const xd=AXES[S.xAxis],yd=AXES[S.yAxis];
  const toL=s=>50+s*4,toT=s=>50-s*4;
  const gv=[-8,-6,-4,-2,2,4,6,8].map(v=>`<line x1="${toL(v)}" y1="3" x2="${toL(v)}" y2="97" stroke="rgba(255,255,255,0.05)" stroke-width="0.2"/>`).join('');
  const gh=[-8,-6,-4,-2,2,4,6,8].map(v=>`<line x1="3" y1="${toT(v)}" x2="97" y2="${toT(v)}" stroke="rgba(255,255,255,0.05)" stroke-width="0.2"/>`).join('');
  const nclX=xd.s.myrtlebeach,nclY=yd.s.myrtlebeach;
  const coQ=(nclY>=0?'t':'b')+(nclX>=0?'r':'l');
  const qNames=getQuadrantNames(S.xAxis,S.yAxis);
  const quadPositions={
    tl:{left:'3%',top:'6%',anchor:'left'},
    tr:{right:'3%',top:'6%',anchor:'right'},
    bl:{left:'3%',bottom:'6%',anchor:'left'},
    br:{right:'3%',bottom:'6%',anchor:'right'}
  };
  const qlabels=['tl','tr','bl','br'].map(q=>{
    const isCo=q===coQ;
    const pos=quadPositions[q];
    const posStyle=pos.bottom!==undefined
      ?(pos.anchor==='right'?`right:${pos.right};bottom:${pos.bottom}`:`left:${pos.left};bottom:${pos.bottom}`)
      :(pos.anchor==='right'?`right:${pos.right};top:${pos.top}`:`left:${pos.left};top:${pos.top}`);
    return `<div id="qlabel-${q}" style="position:absolute;${posStyle};pointer-events:none;text-align:${pos.anchor};z-index:20;max-width:26%">
      <div style="font-family:'Fraunces',serif;font-size:18px;font-weight:600;color:${isCo?'rgba(255,255,255,0.95)':'rgba(255,255,255,0.45)'};line-height:1.4;letter-spacing:0.01em;${isCo?'text-shadow:0 0 20px rgba(63,191,196,0.6)':''}">${qNames[q]}</div>
    </div>`;
  }).join('');
  const axPills=`
    <div id="ax-xl" style="position:absolute;left:14px;top:50%;transform:translateY(-50%);font-family:'Space Mono',monospace;font-size:11px;font-weight:700;color:#0B2530;text-transform:uppercase;letter-spacing:.1em;background:#fff;border-radius:7px;padding:6px 12px;pointer-events:none;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,0.2);z-index:25">\u2190 ${xd.l.toUpperCase()}</div>
    <div id="ax-xr" style="position:absolute;right:14px;top:50%;transform:translateY(-50%);font-family:'Space Mono',monospace;font-size:11px;font-weight:700;color:#0B2530;text-transform:uppercase;letter-spacing:.1em;background:#fff;border-radius:7px;padding:6px 12px;pointer-events:none;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,0.2);z-index:25">${xd.r.toUpperCase()} \u2192</div>
    <div id="ax-yt" style="position:absolute;top:14px;left:50%;transform:translateX(-50%);font-family:'Space Mono',monospace;font-size:11px;font-weight:700;color:#0B2530;text-transform:uppercase;letter-spacing:.1em;background:#fff;border-radius:7px;padding:6px 12px;pointer-events:none;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,0.2);z-index:25">\u2191 ${yd.r.toUpperCase()}</div>
    <div id="ax-yb" style="position:absolute;bottom:14px;left:50%;transform:translateX(-50%);font-family:'Space Mono',monospace;font-size:11px;font-weight:700;color:#0B2530;text-transform:uppercase;letter-spacing:.1em;background:#fff;border-radius:7px;padding:6px 12px;pointer-events:none;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,0.2);z-index:25">\u2193 ${yd.l.toUpperCase()}</div>`;
  const allDests=Object.keys(C);
  const toks=allDests.map(d=>{
    const col=BRIGHT[d]||'#999';
    const isCo=d==='myrtlebeach';
    return `<div id="tok-${d}" class="map-tok" style="left:${toL(xd.s[d]||0)}%;top:${toT(yd.s[d]||0)}%">

      <div class="tok-dot" style="background:${col};box-shadow:0 0 ${isCo?'32px':'20px'} ${col}${isCo?'99':'66'},0 0 ${isCo?'12px':'6px'} ${col}${isCo?'66':'44'};width:${isCo?'60px':'48px'};height:${isCo?'60px':'48px'};${isCo?'border:2px solid rgba(255,255,255,0.6)':''}"></div>

    </div>`;
  }).join('');
  g('canvas').innerHTML=`<div class="fadein">
    <div style="display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap">
      <div class="card" id="chip-x" style="padding:8px 14px;font-size:12px;display:flex;align-items:center;gap:8px"><span class="lbl">X \u2192</span><b>${S.xAxis}</b><span style="color:var(--faint);font-size:10px">${xd.l} \u2194 ${xd.r}</span></div>
      <div class="card" id="chip-y" style="padding:8px 14px;font-size:12px;display:flex;align-items:center;gap:8px"><span class="lbl">Y \u2191</span><b>${S.yAxis}</b><span style="color:var(--faint);font-size:10px">${yd.l} \u2194 ${yd.r}</span></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:0;margin-bottom:16px">

          <span style="font-family:'Space Mono',monospace;font-size:15px;font-weight:700;color:#0B2530;text-transform:uppercase;letter-spacing:.18em;writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap">${S.yAxis}</span>
        </div>
        <div style="position:relative;background:#08262B;border-radius:0 16px 16px 0;aspect-ratio:4/3;flex:1;overflow:visible;box-shadow:0 8px 32px rgba(0,0,0,0.25),0 0 0 1px rgba(63,191,196,0.2)">
          <div style="position:absolute;inset:0;border-radius:0 16px 16px 16px;overflow:hidden;background:linear-gradient(145deg,#0F3A40 0%,#08262B 60%,#051A1E 100%)">
            <svg viewBox="0 0 100 100" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%">${gv}${gh}<line x1="50" y1="3" x2="50" y2="97" stroke="rgba(63,191,196,0.18)" stroke-width="0.35" stroke-dasharray="1 0.6"/><line x1="3" y1="50" x2="97" y2="50" stroke="rgba(63,191,196,0.18)" stroke-width="0.35" stroke-dasharray="1 0.6"/></svg>
            ${axPills}
          </div>
          ${qlabels}
          ${toks}
        </div>
      </div>
      <div style="display:flex">
        <div style="width:44px;flex-shrink:0;background:rgba(63,191,196,0.25);border-radius:0 0 0 10px;border:1px solid rgba(63,191,196,0.5);border-top:none;border-right:none"></div>
        <div id="xbar" style="flex:1;height:44px;background:rgba(63,191,196,0.25);border-radius:0 0 10px 0;display:flex;align-items:center;justify-content:center;border:1px solid rgba(63,191,196,0.5);border-top:none;border-left:none">
          <span style="font-family:'Space Mono',monospace;font-size:15px;font-weight:700;color:#0B2530;text-transform:uppercase;letter-spacing:.18em;white-space:nowrap">${S.xAxis}</span>
        </div>
      </div>
    </div>
    <p class="note">Axis scores are MMGY\u2019s directional assessment (scale \u221210 to +10). Myrtle Beach shown as the anchor. Designed to prompt discussion, not define fact.</p>
  </div>`;
}

function updateSandboxMap(){
  const xd=AXES[S.xAxis],yd=AXES[S.yAxis];
  const toL=s=>50+s*4,toT=s=>50-s*4;
  Object.keys(C).forEach(d=>{
    const t=g(`tok-${d}`);
    if(t){t.style.left=`${toL(xd.s[d]||0)}%`;t.style.top=`${toT(yd.s[d]||0)}%`;}
  });
  const coQ=(yd.s.myrtlebeach>=0?'t':'b')+(xd.s.myrtlebeach>=0?'r':'l');
  const qNames=getQuadrantNames(S.xAxis,S.yAxis);
  const quadAligns={tl:'left',tr:'right',bl:'left',br:'right'};
  ['tl','tr','bl','br'].forEach(q=>{
    const el=g(`qlabel-${q}`);
    if(!el)return;
    const isCo=q===coQ;
    el.style.textAlign=quadAligns[q];
    el.innerHTML=`<div style="font-family:'Fraunces',serif;font-size:18px;font-weight:600;color:${isCo?'rgba(255,255,255,0.95)':'rgba(255,255,255,0.45)'};line-height:1.4;letter-spacing:0.01em;${isCo?'text-shadow:0 0 20px rgba(63,191,196,0.6)':''}">${qNames[q]}</div>`;
  });
  const xl=g('ax-xl'),xr=g('ax-xr'),yt=g('ax-yt'),yb=g('ax-yb');
  if(xl)xl.textContent=`\u2190 ${xd.l.toUpperCase()}`;
  if(xr)xr.textContent=`${xd.r.toUpperCase()} \u2192`;
  if(yt)yt.textContent=`\u2191 ${yd.r.toUpperCase()}`;
  if(yb)yb.textContent=`\u2193 ${yd.l.toUpperCase()}`;
  const cx=g('chip-x'),cy=g('chip-y');
  if(cx)cx.innerHTML=`<span class="lbl">X \u2192</span><b>${S.xAxis}</b><span style="color:var(--faint);font-size:10px">${xd.l} \u2194 ${xd.r}</span>`;
  if(cy)cy.innerHTML=`<span class="lbl">Y \u2191</span><b>${S.yAxis}</b><span style="color:var(--faint);font-size:10px">${yd.l} \u2194 ${yd.r}</span>`;
  const ybar=g('ybar'),xbar=g('xbar');
  if(ybar)ybar.querySelector('span').textContent=S.yAxis;
  if(xbar)xbar.querySelector('span').textContent=S.xAxis;
}

// ── INIT ───────────────────────────────────────────────────────────────────
setTab('swot');
</script>
